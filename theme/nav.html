<script>
/* Page trail and previous/next links, replacing the side menus. */
(function () {
  var meta = document.querySelector('meta[name="quarto:offset"]');
  var base = meta ? meta.getAttribute('content') : './';
  var path = location.pathname.replace(/\\/g, '/');
  function file(p) { return p.split('/').pop().replace(/\.html$/, ''); }
  var here = file(path);
  var dir = path.split('/').slice(-2, -1)[0];

  var courses = [
    ['MA102_MA103', 'MA102/3', 'Introduction to Abstract Mathematics'],
    ['ME306', 'ME306', 'Real Analysis'],
    ['MA210', 'MA210', 'Discrete Mathematics'],
    ['MA423', 'MA423', 'Fundamentals of Operations Research'],
    ['ME200', 'ME200', 'Computational Methods in Financial Mathematics'],
    ['ST310', 'ST310', 'Machine Learning'],
    ['ST455', 'ST455', 'Reinforcement Learning'],
    ['FM250', 'FM250', 'Finance'],
    ['Pre-sessionals', 'MiM/GMiM', 'Pre-sessional courses']
  ];
  var presessionals = { Maths1: 'Maths 1', Maths2: 'Maths 2', Maths3: 'Maths 3', Maths4: 'Maths 4', Stats1: 'Stats 1', Stats2: 'Stats 2', Stats3: 'Stats 3' };
  var notes = { Greatest_authors: 'Greatest Authors', Arxiv: 'Arxiv email', '1758A': 'Codeforces 1758A', OldWork: 'University notes' };

  var trail = null, pager = null;
  var ci = courses.findIndex(function (c) { return c[0] === here; });

  if (dir === 'Teaching' && here !== 'Teaching' && ci >= 0) {
    trail = [['Teaching/Teaching.html', 'Teaching'], [null, courses[ci][1]]];
    pager = [ci > 0 ? courses[ci - 1] : null, ci < courses.length - 1 ? courses[ci + 1] : null];
  } else if (dir === 'Pre-sessionals' && presessionals[here]) {
    trail = [['Teaching/Teaching.html', 'Teaching'], ['Teaching/Pre-sessionals.html', 'Pre-sessionals'], [null, presessionals[here]]];
  } else if (notes[here]) {
    trail = [['main_pages/miscellanea.html', 'Miscellanea'], ['main_pages/code-notes.html', 'Code and notes'], [null, notes[here]]];
  } else if (here === 'SBRD') {
    trail = [['Research/research.html', 'Research'], [null, 'SBRD code']];
  }

  var header = document.getElementById('title-block-header');
  if (trail && header) {
    var nav = document.createElement('nav');
    nav.className = 'trail'; nav.setAttribute('aria-label', 'You are here');
    trail.forEach(function (t, i) {
      if (i) { var s = document.createElement('span'); s.className = 'trail-sep'; s.textContent = '/'; s.setAttribute('aria-hidden', 'true'); nav.appendChild(s); }
      var el = document.createElement(t[0] ? 'a' : 'span');
      if (t[0]) el.href = base + t[0]; else el.setAttribute('aria-current', 'page');
      el.textContent = t[1]; nav.appendChild(el);
    });
    header.parentNode.insertBefore(nav, header);
  }

  var main = document.querySelector('main.content');
  if (pager && main) {
    var p = document.createElement('nav');
    p.className = 'pager'; p.setAttribute('aria-label', 'Other courses');
    pager.forEach(function (c, i) {
      if (!c) { p.appendChild(document.createElement('span')); return; }
      var a = document.createElement('a');
      a.href = base + 'Teaching/' + c[0] + '.html';
      a.className = i ? 'pager-next' : 'pager-prev';
      a.innerHTML = '<span class="pager-dir"></span><span class="pager-code"></span><span class="pager-name"></span>';
      a.children[0].textContent = i ? 'Next course' : 'Previous course';
      a.children[1].textContent = c[1]; a.children[2].textContent = c[2];
      p.appendChild(a);
    });
    main.appendChild(p);
  }
})();
</script>
